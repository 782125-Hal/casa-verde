<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder — {{ CASA_VERDE.NOMBRE }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/casa_verde.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container" style="max-width: 420px;">
        <div class="text-center mt-5 mb-4">
            <i class="bi bi-house-heart-fill text-verde" style="font-size: 2.5rem;"></i>
            <h1 class="h3 mt-2 mb-1">{{ CASA_VERDE.NOMBRE }}</h1>
            <p class="text-muted small mb-0">Detección de oportunidades inmobiliarias</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle"></i>
                    Usuario o contraseña incorrectos.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control"
                               autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-verde w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>
            </div>
        </div>

        <p class="text-center text-muted small mt-4">
            {{ CASA_VERDE.NOMBRE }} &copy; 2026
        </p>
    </main>
</body>
</html>
